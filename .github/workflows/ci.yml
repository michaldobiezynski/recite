name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Tighten the default GITHUB_TOKEN scope; nothing here needs write access.
permissions:
  contents: read

# Cancel superseded runs on the same ref so a flurry of pushes during PR
# review does not waste macOS billable minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Run on macOS only because the runtime shells out to `say`, `afplay`, and
# `afinfo`, which exist only on macOS. Pure-Python tests would run on Linux,
# but importing the app pulls in audio-adjacent code, so we keep one matrix.
jobs:
  test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Lint
        run: ruff check recite/ tests/

      - name: Test
        run: pytest -v
