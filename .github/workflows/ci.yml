name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Run on macOS only — the runtime shells out to `say`, `afplay`, and `afinfo`,
# which exist only on macOS. Tests that don't touch audio still benefit from
# the same matrix because importing the app pulls in audio-adjacent code.
jobs:
  test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Lint
        run: ruff check recite/ tests/

      - name: Test
        run: pytest -v
